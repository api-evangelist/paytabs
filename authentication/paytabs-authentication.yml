notes: >-
  PayTabs PT2 authenticates server-to-server calls with a merchant server key
  sent as the raw value of the `authorization` HTTP header (NOT an OAuth/Bearer
  token). The `profile_id` in the request body identifies which profile the
  server key acts on. A separate client key is used for browser-side own-form /
  tokenization. Keys are region-scoped: a key must be used against the host that
  matches its region (e.g. secure.paytabs.sa for KSA) or authentication fails.
